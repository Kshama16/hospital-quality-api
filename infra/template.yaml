AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Hospital Quality API - Lambda + API Gateway HTTP API + DynamoDB, with CloudWatch alarms.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional email address for alarm notifications.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 512
    Timeout: 10
    Tracing: Active

Resources:
  HospitalTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub hospital-quality-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: state, AttributeType: S }
        - { AttributeName: provider_id, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: state-index
          KeySchema:
            - { AttributeName: state, KeyType: HASH }
            - { AttributeName: provider_id, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub hospital-quality-api-${Stage}
      CodeUri: ..
      Handler: app.lambda_handler.handler
      Environment:
        Variables:
          REPOSITORY: dynamodb
          TABLE_NAME: !Ref HospitalTable
          CACHE_TTL_SECONDS: "300"
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref HospitalTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi

  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/hospital-quality-api-${Stage}
      RetentionInDays: 30

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription: !If
        - HasAlarmEmail
        - [{ Endpoint: !Ref AlarmEmail, Protocol: email }]
        - !Ref AWS::NoValue

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Lambda errors in 2 of 3 five-minute periods
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{ Name: FunctionName, Value: !Ref ApiFunction }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  LatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: p95 API latency above 500 ms (from the EMF metrics the app logs)
      Namespace: HospitalQualityApi
      MetricName: Latency
      Dimensions: [{ Name: route, Value: "/hospitals/{provider_id}" }]
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      Threshold: 500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  TableName:
    Value: !Ref HospitalTable
